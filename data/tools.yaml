# =============================================================================
# Awesome VPS — Single Source of Truth (YAML data source)
# =============================================================================
# This file is the canonical data source for the tool lists rendered in
# README.md (English) and README.zh.md (Chinese). Both READMEs are generated
# from this file by `scripts/generate-readme.sh`.
#
# To add or edit a tool, modify THIS file and re-run:
#     ./scripts/generate-readme.sh --lang all
# Then commit data/tools.yaml together with the regenerated READMEs.
#
# -----------------------------------------------------------------------------
# Category fields
# -----------------------------------------------------------------------------
#   id:     stable identifier used by tools (category: <id>)
#   emoji:  section emoji shown in the README heading
#   title:  {en, zh} section title
#   intro:  {en, zh} one-line description shown under the heading
#   note:   {en, zh} optional callout rendered after the tool list
#   outro:  {en, zh} optional paragraph rendered after the tool list / note
#
# -----------------------------------------------------------------------------
# Tool fields
# -----------------------------------------------------------------------------
#   name:            display name (string, or {en, zh} when it differs)
#   url:             canonical link (GitHub repo or official site)
#   description:     {en, zh} one-line, original-wording description
#   category:        one of the category ids listed above
#   language:        primary implementation language (e.g. Go, Shell, Python)
#                    optional — omit for ecosystem entries that have no language
#   activity_status: one of active / maintained / stagnant / archived
#                    maps to 🟢 / 🟡 / 🔴 / ⚫
#                    refreshed by `scripts/update-metadata.sh --update`
#   stars:           optional GitHub star count (refreshed by update-metadata.sh)
#   extra_links:     optional list of {name, url} rendered as " + [name](url)"
#                    (used for combined entries such as Grafana + Prometheus)
#
# Activity status levels:
#   active      🟢  commit within the last 6 months
#   maintained  🟡  commit within the last 6–12 months
#   stagnant    🔴  no commit in 12+ months
#   archived    ⚫  repository is archived / read-only
# =============================================================================

categories:
  - id: init
    emoji: "🔧"
    title:
      en: "Initialization & Setup"
      zh: "初始化与设置"
    intro:
      en: "Tools for the first few minutes after you get a fresh server."
      zh: "拿到新服务器后最初几分钟要用的工具。"

  - id: hardening
    emoji: "🛡️"
    title:
      en: "Hardening & Security"
      zh: "加固与安全"
    intro:
      en: "Tools to protect your server from attacks."
      zh: "保护服务器免受攻击的工具。"

  - id: network
    emoji: "🌐"
    title:
      en: "Network & Proxy"
      zh: "网络与反代"
    intro:
      en: "Tools for exposing services, managing SSL, and traversing NAT."
      zh: "暴露服务、管理 SSL、穿透内网的工具。"

  - id: deployment
    emoji: "📦"
    title:
      en: "Deployment"
      zh: "部署"
    intro:
      en: "Tools for deploying and managing applications on your VPS."
      zh: "在 VPS 上部署和管理应用的工具。"

  - id: monitoring
    emoji: "📊"
    title:
      en: "Monitoring"
      zh: "监控"
    intro:
      en: "Tools to know if your services are up and your server is healthy."
      zh: "了解服务是否在线、服务器是否健康的工具。"

  - id: backup
    emoji: "💾"
    title:
      en: "Backup & Recovery"
      zh: "备份与恢复"
    intro:
      en: "Tools to ensure your data survives disasters."
      zh: "确保数据在灾难中存活下来的工具。"

  - id: ai
    emoji: "🤖"
    title:
      en: "AI Self-Hosting"
      zh: "AI 自托管"
    intro:
      en: "Tools to run AI models on your own server."
      zh: "在自己的服务器上运行 AI 模型的工具。"

  - id: audit
    emoji: "🔍"
    title:
      en: "Audit & Compliance"
      zh: "审计与合规"
    intro:
      en: "Tools to check your server for vulnerabilities and compliance."
      zh: "检查服务器漏洞和合规性的工具。"

  - id: archived
    emoji: "🗃️"
    title:
      en: "Archived / Historical"
      zh: "归档 / 历史"
    intro:
      en: "Tools that were once useful but whose upstream repositories are now archived. Kept here for reference; prefer the active alternatives above."
      zh: "曾经有用、但上游仓库现已归档的工具。保留在此供参考；请优先使用上方的活跃替代品。"
    note:
      en: "Know an archived VPS tool that should be listed here? Open an issue or PR."
      zh: "知道其他已归档的 VPS 工具？欢迎提 issue 或 PR。"

  - id: ecosystem
    emoji: "🧩"
    title:
      en: "0x10debug Ecosystem"
      zh: "0x10debug 生态"
    intro:
      en: "The repos below, maintained under the [0x10debug](https://github.com/0x10debug) account, form a complete VPS operations + security toolchain. Each one is designed to be composable: bootstrap a server, harden it, deploy apps, monitor, back up, and audit—end to end."
      zh: "以下仓库由 [0x10debug](https://github.com/0x10debug) 账号维护，构成完整的 VPS 运营 + 安全工具链。每个都可组合使用：初始化服务器、加固、部署应用、监控、备份、审计——端到端覆盖。"
    outro:
      en: "Together they cover the full VPS lifecycle: **bootstrap → harden → deploy → monitor → back up → audit**."
      zh: "它们共同覆盖完整的 VPS 生命周期：**初始化 → 加固 → 部署 → 监控 → 备份 → 审计**。"

# =============================================================================
# Tools
# =============================================================================

